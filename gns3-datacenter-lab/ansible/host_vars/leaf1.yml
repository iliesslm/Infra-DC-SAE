---
loopback_ip: 10.0.0.11
bgp_asn: 65011
underlay_interfaces:
  - { name: eth1, ip: 10.1.1.1/31 }
  - { name: eth2, ip: 10.1.2.1/31 }
underlay_neighbors:
  - { address: 10.1.1.0, remote_as: 65000 }
  - { address: 10.1.2.0, remote_as: 65000 }
evpn_neighbors:
  - { address: 10.0.0.1, remote_as: 65000 }
  - { address: 10.0.0.2, remote_as: 65000 }
# VLAN 10 etendu entre les leafs par le L2VNI 10010 ; eth3 = port d'acces vers client1
l2_vnis:
  - { vni: 10010, vlan: 10, ports: [eth3] }
