# Telegraf : interroge en SNMP v2c tous les routeurs/bordures et ecrit dans InfluxDB
# Les OID sont numeriques (aucun fichier MIB necessaire).
[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  omit_hostname = true

[[outputs.influxdb]]
  urls = ["http://192.168.100.41:8086"]
  database = "telegraf"

# ---------- spines + leafs ----------
[[inputs.snmp]]
  name = "dc"
  agents = ["udp://192.168.100.11:161", "udp://192.168.100.12:161", "udp://192.168.100.21:161", "udp://192.168.100.22:161"]
  version = 2
  community = "dclab"
  timeout = "5s"
  retries = 1

  [[inputs.snmp.field]]
    name = "hostname"
    oid = ".1.3.6.1.2.1.1.5.0"
    is_tag = true
  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"
  [[inputs.snmp.field]]
    name = "bgp_established"
    oid = ".1.3.6.1.4.1.8072.1.3.2.3.1.1.15.98.103.112.95.101.115.116.97.98.108.105.115.104.101.100"
    conversion = "int"

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"
    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"
    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

# ---------- bordures (pare-feu + IPsec) ----------
[[inputs.snmp]]
  name = "dc"
  agents = ["udp://192.168.100.31:161", "udp://192.168.100.32:161"]
  version = 2
  community = "dclab"
  timeout = "5s"
  retries = 1

  [[inputs.snmp.field]]
    name = "hostname"
    oid = ".1.3.6.1.2.1.1.5.0"
    is_tag = true
  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"
  [[inputs.snmp.field]]
    name = "ike_established"
    oid = ".1.3.6.1.4.1.8072.1.3.2.3.1.1.15.105.107.101.95.101.115.116.97.98.108.105.115.104.101.100"
    conversion = "int"
  [[inputs.snmp.field]]
    name = "child_installed"
    oid = ".1.3.6.1.4.1.8072.1.3.2.3.1.1.15.99.104.105.108.100.95.105.110.115.116.97.108.108.101.100"
    conversion = "int"

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"
    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"
    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"
